services:
  mlflow:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./:/app
      - mlflow_data:/mlflow
    command: >
      sh -c "pip install --no-cache-dir mlflow==2.17.2 &&
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --serve-artifacts"
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL","python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000')\""]
      interval: 10s
      timeout: 5s
      retries: 20

  init:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    volumes:
      - ./:/app
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_MODEL_NAME: OrvexaRegressor
    depends_on:
      mlflow:
        condition: service_healthy
    command: >
      sh -c "python data/prepare_data.py &&
      python -c 'import sys; sys.path.insert(0,"."); from training.train import run_campaign; run_campaign("L0",30)' &&
      python registry/baseline.py"
    restart: "no"

  pipeline:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    volumes:
      - ./:/app
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_MODEL_NAME: OrvexaRegressor
    depends_on:
      init:
        condition: service_completed_successfully
    command: ["python","pipeline/orchestrator.py"]

  serving:
    build:
      context: .
      dockerfile: serving/Dockerfile
    volumes:
      - ./:/app
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_MODEL_NAME: OrvexaRegressor
    depends_on:
      mlflow:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    command: ["python","serving/app.py"]

volumes:
  mlflow_data:
